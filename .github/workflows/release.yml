# version.json의 버전이 바뀌면 Release(v버전)를 만들고 Chagok.zip을 올려요.
# 앱의 '업데이트 설치'와 README 설치 링크가 이 파일을 받아요. 다운로드 횟수도 여기서 집계돼요.
name: release

on:
  push:
    branches: [main]
    paths: [version.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 버전 읽기
        id: v
        run: |
          echo "version=$(jq -r .version version.json)" >> "$GITHUB_OUTPUT"
          echo "notes=$(jq -r '.notes // ""' version.json)" >> "$GITHUB_OUTPUT"
      - name: Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG 이미 있음"; exit 0; fi
          mkdir -p out/Chagok
          git archive HEAD | tar -x -C out/Chagok
          (cd out && zip -qr Chagok.zip Chagok)
          gh release create "$TAG" out/Chagok.zip --title "차곡 ${{ steps.v.outputs.version }}" \
            --notes "${{ steps.v.outputs.notes }}" --target "$GITHUB_SHA" --latest
