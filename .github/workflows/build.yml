# 코드를 올릴 때마다: 계산 규칙 검사 → 애플 실리콘·인텔 앱 빌드 → DMG → 실행 확인
name: build

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            dmg: Chack-AppleSilicon
          - arch: x86_64
            runner: macos-15-intel
            dmg: Chack-Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: 계산 규칙 검사
        run: |
          set -o pipefail
          xcrun swiftc -swift-version 5 -o /tmp/chack-tests \
            Sources/Models.swift Sources/Calc.swift Sources/Sync.swift Sources/Parser.swift Sources/SampleData.swift \
            Tests/main.swift 2>&1 | tee /tmp/test-build.log || { grep -E "error:" /tmp/test-build.log | head -40 | sed 's/^/::error::/'; exit 1; }
          /tmp/chack-tests 2>&1 | tee /tmp/test.log || { grep "❌" /tmp/test.log | head -40 | sed 's/^/::error::/'; exit 1; }
          echo "::notice::${{ matrix.arch }} $(tail -1 /tmp/test.log)"
      - name: 앱 빌드
        run: |
          set -o pipefail
          bash scripts/build-app.sh ${{ matrix.arch }} 2>&1 | tee /tmp/build.log || { grep -E "error:" /tmp/build.log | sort -u | head -45 | sed 's/^/::error::/'; exit 1; }
          echo "::notice::${{ matrix.arch }} 경고 $(grep -c 'warning:' /tmp/build.log || true)개, 실행 파일 $(lipo -archs "dist/${{ matrix.arch }}/Chack!.app/Contents/MacOS/Chack")"
      - name: DMG 만들기
        run: bash scripts/make-dmg.sh ${{ matrix.arch }}
      - name: DMG 열어서 실행 확인 (5초)
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/chackdmg "dist/${{ matrix.dmg }}.dmg" >/dev/null
          ls /tmp/chackdmg
          "/tmp/chackdmg/Chack!.app/Contents/MacOS/Chack" &
          PID=$!
          sleep 5
          if kill -0 $PID 2>/dev/null; then echo "::notice::${{ matrix.arch }} 실행 중 ✅"; kill $PID; else echo "::error::앱이 바로 종료됐어요"; exit 1; fi
          hdiutil detach /tmp/chackdmg >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dmg }}
          path: dist/${{ matrix.dmg }}.dmg
          retention-days: 7
